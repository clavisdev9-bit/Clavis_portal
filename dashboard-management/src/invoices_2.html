    <script>
        document.addEventListener('alpine:initialized', () => {
            const app = Alpine.store('app');
            const applyMode = () => {
                if (app.mode === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            };

            // initial
            applyMode();

            // watch perubahan
            Alpine.effect(() => {
                applyMode();
            });
        });
    </script>

        .wrapper {
            --font-color-dark: #bebfc5;
            --font-color-light: #bebfc5;
            --bg-color: #212121;
            --main-color: #0c0c0c;
            --secondary-color: #141414;
            position: relative;
            width: 250px;
            height: 36px;
            background-color: var(--bg-color);
            border: 2px solid var(--main-color);
            border-radius: 34px;
            display: flex;
            flex-direction: row;
            box-shadow: 4px 4px var(--main-color);
            }

            .option {
            margin-right: 5px;
            width: 80.5px;
            height: 28px;
            position: relative;
            top: 2px;
            left: 2px;
            border-radius: 34px;
            transition: 0.25s cubic-bezier(0, 0, 0, 1);
            }

            .option:last-child {
            margin-right: 4px;
            }

            .option:hover {
            background-color: var(--secondary-color);
            }

            .option:hover .span {
            color: var(--font-color-light);
            }

            .input {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            appearance: none;
            cursor: pointer;
            }

            .btn {
            width: 100%;
            height: 100%;
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            }

            .span {
            color: var(--font-color-dark);
            }

            .input:checked + .btn {
            background-color: var(--main-color);
            transition: 0.2s cubic-bezier(0, 0, 0, 1);
            }

            .input:checked + .btn .span {
            color: var(--font-color-light);
            transition: 0.25s cubic-bezier(0, 0, 0, 1);
            }
