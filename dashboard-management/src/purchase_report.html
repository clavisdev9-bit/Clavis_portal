{{> partials/main }}

<head>

    {{> partials/title-meta title="Blog" }}

    {{> partials/head-css }}
    <script>
        document.addEventListener('alpine:initialized', () => {
            const app = Alpine.store('app');
            const applyMode = () => {
                if (app.mode === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            };

            // initial
            applyMode();

            // watch perubahan
            Alpine.effect(() => {
                applyMode();
            });
        });
    </script>
    <style>
        #purchaseTable_length select {
            width: 6vh;
        }
        
        #purchaseTable {
            width: 100% !important;
        }
        .dark .date-input {
            background-color: #0f172a !important;
            color: white !important;
        }

        .dark .date-input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
</head>
