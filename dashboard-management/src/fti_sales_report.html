    <script>
        document.addEventListener('alpine:initialized', () => {
            const app = Alpine.store('app');
            const applyMode = () => {
                if (app.mode === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            };

            // initial
            applyMode();

            // watch perubahan
            Alpine.effect(() => {
                applyMode();
            });
        });
    </script>
    <style>
        .dark .filter-border{
            border-color: #696969;
        }
        .filter-border{

        }

        }
